services:
  app:
    image: node:20
    ports:
      - "8082:3000"
    command: >
      sh -c "npm install && npm run start:dev"
    environment:
      NODE_ENV: development

      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: minio
      MINIO_PASSWORD: ${MINIO_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uikit-repo-db

      JWT_SECRET: ${JWT_SECRET}

      UIKIT_BUILD_SERVICE_URL: http://build:3000
    working_dir: /app
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /tmp:/tmp
    networks:
      base:

  build:
    image: ghcr.io/48-iq/uikit-build:v0.0.27
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: minio
      MINIO_PASSWORD: ${MINIO_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_ISSUER: uikit.space-auth-service
      JWT_AUDIENCE: uikit.space
      JWT_ALGORITHM: HS256
      JWT_EXP_TIME: 300s
      JWT_SECRET: ${JWT_SECRET}

      POSTGRES_DB: uikit-build-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      CORS_ORIGIN: http://localhost:3000
    networks:
      base:

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      base:
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    networks:
      base:
    restart: unless-stopped

  postgres:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      base:
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data:

networks:
  base:
